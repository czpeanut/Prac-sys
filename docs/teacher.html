<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習總覽</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>main, .top { max-width: 1100px; }</style>
</head>
<body>
<header class="top"><h1>練習總覽（老師）</h1><a href="./" class="small">學生頁面</a></header>
<main>
  <form id="f" class="card" style="display:flex;gap:8px">
    <input id="key" type="password" placeholder="老師密碼" required autocomplete="current-password">
    <button class="primary" style="flex:none">查看</button>
  </form>
  <p id="err" class="err"></p>
  <div id="out"></div>
  <div id="detail"></div>
</main>
<script type="module">
import * as P from "./practice.js";
import { online, overview } from "./store.js";
import { masteryLegend, typeTable } from "./ui.js";
import { boardTable, mountainView } from "./board.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let pool, students = [];

if (!online) $("#err").textContent = "還沒有設定 Supabase（docs/config.js），練習紀錄存在各學生的裝置上，無法總覽。";

$("#f").onsubmit = async (e) => {
  e.preventDefault();
  $("#err").textContent = "";
  try {
    if (!pool) {
      const raw = await fetch("pool.json").then((r) => r.json());
      pool = { ...raw, byId: Object.fromEntries(raw.questions.map((q) => [q.id, q])) };
    }
    students = await overview($("#key").value);
  } catch (err) { $("#err").textContent = err.message; return; }
  const day = P.today();
  // 欠最多的排前面
  students = students.map((s) => ({ ...s, debt: P.debt(s, day) })).sort((a, b) => b.debt.owed - a.debt.owed || b.debt.todayLeft - a.debt.todayLeft);
  const head = pool.units.map((u) => `<th title="${esc(u.title)}">${esc(u.code)}</th>`).join("");
  const counts = Object.fromEntries(P.DEBT_LEVELS.map((l) => [l.key, 0]));
  students.forEach((s) => counts[s.debt.level.key]++);
  const notDone = students.filter((s) => s.debt.started && s.debt.todayLeft).length;
  const w = students[0]?.debt.week ?? P.debt({ sets: {} }, day).week;
  const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8)}`;
  const rest = P.isRestDay(day);
  const legend = P.DEBT_LEVELS.map((l) => `<span><span class="badge lv-${l.key}">${esc(l.label)}</span>${l.min ? `欠 ${l.min} 題以上` : "沒有欠題"}：${counts[l.key]} 人</span>`).join("");
  const rows = students.map((s, i) => {
    const p = P.progress(pool, s, day);
    const total = p.units.reduce((a, u) => a + u.attempts, 0);
    const right = P.records(s).filter((r) => r.ok).length;
    const d = s.debt;
    const todayCell = !d.started ? "—" : d.rest ? `<span class="muted">休息</span>${d.todayDone ? ` ${d.todayDone}` : ""}`
      : d.todayLeft ? `<span class="due">${d.todayDone}／${P.DAILY_GOAL}</span>` : `<span class="lv-ok-text">✔ ${d.todayDone}</span>`;
    const weekCell = d.started ? `${d.week.done}／${d.week.goal}` : "—";
    return `<tr><td><button class="link" data-i="${i}">${esc(s.name)}</button></td>
      <td>${todayCell}</td><td>${weekCell}</td>
      <td><span class="badge lv-${d.level.key}">${esc(d.level.label)}</span>${d.owed ? `<div class="small">欠 ${d.owed} 題</div>` : ""}</td>
      <td>${p.mastered}／${p.typeCount}</td>
      ${p.units.map((u) => `<td>${u.mastered}／${u.typeCount}<div class="muted small">${u.attempts} 題</div></td>`).join("")}
      <td>${total}<div class="muted small">${total ? Math.round((100 * right) / total) : 0}%</div></td>
      <td>${p.streak} 天</td><td>${esc(p.days[0]?.day ?? "—")}</td></tr>`;
  }).join("");
  $("#out").innerHTML = `<div class="card"><h3>每日進度（每天 ${P.DAILY_GOAL} 題，週四休息；${md(P.GOAL_START)} 起算，每週五到下週四一個週期）</h3>
    <p>${day < P.GOAL_START ? `還沒開始，${md(P.GOAL_START)} 起算。` : rest ? "今天週四休息，不計題目。"
      : `今天還沒練完：<b class="due">${notDone}</b> 人`}　本週：第 ${w.index} 週（${md(w.start)}～${md(w.end)}），每人 ${w.goal} 題</p><div class="legend">${legend}</div>
      <div class="actions"><button class="primary" id="projector">⛰ 爬山畫面＋排行榜（投影）</button></div></div>
    <div class="card scroll"><p class="muted small">欠題＝過去每天應完成的題數減掉實際作答（今天做滿 ${P.DAILY_GOAL} 題後多做的會拿來還）。各單元：熟練以上題型／題型數，下方為累計作答題數。點名字看各題型細節。</p>
    <table class="list"><tr><th>學生</th><th>今天</th><th>本週</th><th>欠題</th><th>熟練題型</th>${head}<th>作答／正確率</th><th>連續達標</th><th>最近練習</th></tr>${rows ||
    '<tr><td colspan="99" class="muted">還沒有學生</td></tr>'}</table></div>`;
  $("#detail").innerHTML = "";
  document.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => detail(students[b.dataset.i])));
  $("#projector").onclick = () => projector(day);
};

// 投影模式：全螢幕爬山畫面＋本週排行（高度、排行都用完整紀錄現算）
async function projector(day) {
  const rows = students.map((s) => {
    const { done, goalDays } = P.weekStats(s, day);
    return { name: s.name, height: P.climbHeight(pool, s, day), done, goalDays };
  });
  const box = document.createElement("div");
  box.className = "mtn-full";
  box.innerHTML = `<button class="close">✕ 關閉</button><div class="mtn"></div><aside>${boardTable(rows, { top: 15, day })}
    <p class="muted small">高度＝熟練度；本週有練習的人在爬，還沒練的人坐著休息。</p></aside>`;
  document.body.append(box);
  box.requestFullscreen?.().catch(() => {});
  const scene = await mountainView(box.querySelector(".mtn"), rows, { units: pool.units, day });
  const close = () => { scene.dispose(); box.remove(); document.fullscreenElement && document.exitFullscreen(); removeEventListener("keydown", onKey); };
  const onKey = (e) => e.key === "Escape" && close();
  addEventListener("keydown", onKey);
  box.querySelector(".close").onclick = close;
}

function detail(s) {
  const p = P.progress(pool, s, P.today());
  const flagged = p.units.flatMap((u) => u.types.filter((t) => t.stuck).map((t) => `${u.code} ${t.name}`));
  $("#detail").innerHTML = `<h2>${esc(s.name)}</h2>` +
    (flagged.length ? `<p class="card"><span class="tag flag-stuck">卡關</span> 建議個別講解：${flagged.map(esc).join("、")}</p>` : "") +
    p.units.map((u) => `<div class="card unit">
    <h3><span>${esc(u.book)} ${esc(u.code)} ${esc(u.title)}</span><span class="muted small">熟練以上 ${u.mastered}／${u.typeCount}</span></h3>
    ${typeTable(u, { desc: false })}</div>`).join("") + `<div class="card">${masteryLegend()}</div>`;
  $("#detail").scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
