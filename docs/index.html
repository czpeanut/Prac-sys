<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日數學練習</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="math.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>每日數學練習</h1>
  <div id="who" hidden><span id="who-name"></span> <button class="link" id="logout">換人</button></div>
</header>

<main>
  <!-- 登入 -->
  <section id="v-login" class="card narrow" hidden>
    <h2 id="login-title">選擇你的名字</h2>
    <form id="pick-form" class="row" hidden>
      <select id="pick-name" required><option value="">— 請選擇 —</option></select>
      <button class="primary">開始</button>
    </form>
    <p id="login-loading" class="muted">載入名單中…</p>
    <div id="new-wrap" hidden>
      <p class="muted small" id="new-hint">第一次練習？輸入你的名字（之後就會出現在上面的選單裡）</p>
      <form id="login-form" class="row">
        <input id="login-name" maxlength="20" placeholder="例如：王小明" autocomplete="off" required>
        <button class="primary">新增並開始</button>
      </form>
    </div>
    <p id="login-err" class="err"></p>
  </section>

  <!-- 主畫面 -->
  <div id="v-main" hidden>
    <p id="sync" class="card err" hidden></p>
    <nav class="tabs">
      <button data-tab="today" class="on">今日練習</button>
      <button data-tab="progress">練習進度</button>
      <button data-tab="scope">練習範圍</button>
    </nav>

    <section id="t-today">
      <div class="card summary">
        <div><b id="today-day"></b>　<span id="today-scope" class="muted"></span></div>
        <div class="bar"><i id="today-bar"></i></div>
        <div id="today-count" class="muted"></div>
      </div>
      <div id="items"></div>
      <div id="today-done" class="card done" hidden></div>
    </section>

    <section id="t-progress" hidden>
      <div class="card summary" id="prog-summary"></div>
      <div id="prog-units"></div>
      <div class="card">
        <h3>最近練習</h3>
        <div id="prog-days" class="days"></div>
      </div>
      <p class="muted small">題型熟練：答對 4 題以上，且最近 5 次作答答對 80% 以上。單元進度＝已熟練的題型數／題型數（「其他題型」不計）。</p>
    </section>

    <section id="t-scope" hidden>
      <div class="card">
        <h3>選擇要練習的單元</h3>
        <p class="muted">每天的 20 題只從勾選的單元出，會優先出還不熟練的題型。</p>
        <div id="scope-list"></div>
        <button class="primary" id="scope-save">儲存範圍</button>
        <p id="scope-msg" class="muted"></p>
      </div>
      <div class="card" id="backup-card">
        <h3>練習紀錄備份</h3>
        <p class="muted small">紀錄存在這台裝置的瀏覽器裡。換裝置或清除瀏覽器資料前，先下載備份，之後再還原。</p>
        <div class="actions">
          <button id="backup">下載我的紀錄</button>
          <label class="filebtn">還原紀錄<input type="file" id="restore" accept="application/json,.json" hidden></label>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="muted small">題目取自 OLE-QS 題庫的公開試題，每題下方標示出處。</footer>
<script type="module" src="app.js"></script>
</body>
</html>
